# GitHub Pages build settings. The site is plain static HTML; this file only keeps working folders out of the
# published site. ct-001/, ct-002/, ct-003/ and ct-005/ hold the scripts and notes behind the job-data pages, and
# ct-004/ the AdSense checks (ct-005/ also the GoatCounter test and Lighthouse runner): they stay in the repository
# (public on GitHub) but are not served as pages. scripts/ holds the benchmark harness (md-009) and md-009/ its ruling,
# review and reply draft; they are kept out of the build the same way.
exclude:
  - ct-001
  - ct-002
  - ct-003
  - ct-004
  - ct-005
  - scripts
  - md-009
